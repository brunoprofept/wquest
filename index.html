<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProfEPT - Programa de Pós-Graduação</title>
  <style>
    /* Reseta margens e faz a página ocupar 100% da altura da tela */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      justify-content: center; /* Centraliza na horizontal */
      align-items: center;    /* Centraliza na vertical */
      min-height: 100vh;      /* Garante a altura total da janela */
      background-color: #f4f7f6; /* Fundo suave combinando com a identidade visual */
    }

    .container {
      text-align: center;
      padding: 20px;
    }

    .container img {
      max-width: 100%;
      height: auto;
      border-radius: 8px; /* Cantos levemente arredondados */
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08); /* Sombra suave */
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Substitua 'ProfEPT.jpg' pelo caminho ou nome exato do arquivo da imagem -->
    <img src="ProfEPT.jpg" alt="Logo ProfEPT - Programa de Pós-Graduação em Educação Profissional e Tecnológica">
  </div>

</body>
</html>
